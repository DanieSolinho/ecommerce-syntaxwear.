<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>SyntaxWear - Tênis e Sneakers Online</title>

    <meta
      name="description"
      content="Compre os melhores tênis e sneakers online na SyntaxWear. Encnotre os modelos mais estilosos e confortáveis para todas as ocasiões. Frete grátis e entrega rápida!"
    />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components/header.css" />
    <link rel="stylesheet" href="css/components/hero.css" />
    <link rel="stylesheet" href="css/components/product-category.css" />
    <link rel="stylesheet" href="css/components/product.grid.css"/>

  </head>

  <body>
    <!-- Header com logo e navegação -->

    <header class="site-header">
      <h1 class="logo">
        <a href="/" title="SyntaxWear - Tênis e Sneakers Online">
          <img
            src="/images/logo/logo.svg"
            alt="SyntaxWear - Tênis e Sneakers Online"
          />
        </a>
      </h1>
      <nav class="nav-center" aria-label="Catergorias Principais">
        <ul>
          <li><a href="#">Masculino</a></li>
          <li><a href="#">Feminino</a></li>
          <li><a href="#">Outlet</a></li>
        </ul>
      </nav>
      <nav class="nav-right" aria-label="Secondary Navigation">
        <ul>
          <li><a href="#">Nossas lojas</a></li>
          <li><a href="#">Sobre</a></li>
          <li>
            <a href="#" aria-label="Conta"
              ><img src="/images/icons/account.svg" alt="Minha Conta"
            /></a>
          </li>
          <li>
            <a href="#" aria-label="Ajuda"
              ><img src="/images/icons/help.svg" alt="Ajuda"
            /></a>
          </li>
          <li>
            <a href="#" aria-label="Carrinho"
              ><img src="/images/icons/cart.svg" alt="Carrinho"
            /></a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- Seção Hero -->

      <section class="hero-section">
        <div class="hero-overlay">
          <div class="hero-content">
            <span class="hero-subtitle">Krypton One</span>
            <h2 class="hero-title">Transforme qualquer passo em presença.</h2>

            <div class="hero-buttons">
              <a class="btn btn-outline" href="#">Ver Modelos</a>
              <a class="btn btn-filled" href="#">Comprar</a>
            </div>
          </div>
        </div>
      </section>

      <!-- Seção de Categorias de Tênis -->

      <section class="categories-section">
          <div class="category-card casual">
            <a href="#" class="category-link">
              <span class="overlay"></span>
              <span class="category-name btn btn-outline">Casual</span>
            </a>
          </div>
          <div class="category-card esporte">
            <a href="#" class="category-link">
              <span class="overlay"></span>
              <span class="category-name btn btn-outline">Esporte</span>
            </a>
          </div>
          <div class="category-card moderno">
            <a href="#" class="category-link">
              <span class="overlay"></span>
              <span class="category-name btn btn-outline">Moderno</span>
            </a>
          </div>
          <div class="category-card futurista">
            <a href="#" class="category-link">
              <span class="overlay"></span>
              <span class="category-name btn btn-outline">Futurista</span>
            </a>
          </div>
      </section>

      <!-- Grid com Produtos em Destaques -->

      <section class="grid-section">

        <div class="card destaque">
          <div class="top1-content">
              <h3 class="card-title">Krypton One</h3>
              <p class="card-subtitle">Estilo Urbano com atitude</p>
              <div class="cta-group">
                <a href="#" class="btn btn-outline">Feminino</a>
                <a href="#" class="btn btn-outline">Masculino</a>
              </div>
            </div>
        </div>
        
        <div class="card sneaker-purple"></div>
        <div class="card model"></div>
        <div class="card sneaker-color"></div>
        <div class="card sneaker-white"></div>
        <div class="card sneaker-silver"></div>
      </section>
    </main>

    <!-- Footer com informações de contato e links -->
    <footer>
      <div class="footer-content">
        <div class="footer-links"></div>
        <div class="footer-contact"></div>
        <div class="footer-copyright">
          <p>&copy; 2026 SyntaxWear. Todos os direitos reservados.</p>
        </div>
      </div>
    </footer>
  </body>
</html>
